# Offline checks for every pull request. No secrets, read-only token.
# Branch protection on main should require the "lint" check.
name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        # actions/checkout v4, pinned to its commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node
        # actions/setup-node v4, pinned to its commit
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.mjs'); do node --check "$f"; done

      - name: Config is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('poster/config.json','utf8'))"

      - name: Agent kit manifest is up to date
        run: node agent/tools/make-manifest.mjs --check

      - name: Tests (offline)
        run: node --test "**/*.test.mjs"
